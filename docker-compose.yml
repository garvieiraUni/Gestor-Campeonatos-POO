# Sobe o PostgreSQL para desenvolvimento.
#   docker compose up -d
# Banco principal: campeonatos · banco dos testes de integração: campeonatos_test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campeonatos
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./backend/scripts/criar-banco-teste.sql:/docker-entrypoint-initdb.d/criar-banco-teste.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  dados-postgres:
